<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Mente Digital · Central de Comando</title>

<style>
:root{--bg:#050914;--bg2:#0a1124;--card:#0d1630;--line:#1a2750;--blue:#2f6bff;--blue2:#5b8cff;--txt:#f4f7ff;--mut:#8b98bd;--ok:#2ee6a6;--warn:#ffb547;--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr) 430px;height:100%}
aside.nav{background:var(--bg2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;font-weight:600;font-size:15px}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--blue),#8fb0ff);display:grid;place-items:center;box-shadow:0 0 22px #2f6bff66}
.logo small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--mut);text-align:left;transition:.15s}
.nav button:hover{background:#111c3d;color:var(--txt)}
.nav button.on{background:linear-gradient(90deg,#2f6bff2e,#2f6bff0a);color:#fff;box-shadow:inset 2px 0 0 var(--blue)}
.nav svg,.ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0c1531}
.av{width:32px;height:32px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-weight:600;font-size:12px}
.me small{color:var(--mut);display:block;font-size:11px}
main{display:flex;flex-direction:column;min-width:0;padding:20px;gap:16px;overflow-y:auto}

.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px currentColor;color:var(--ok);flex:none}
.dot.busy{background:var(--blue2);color:var(--blue2);animation:pulse 1.2s infinite}
.dot.idle{background:var(--warn);color:var(--warn)}
.dot.off{background:#4a5578;color:#4a5578;box-shadow:none}.dot.err{background:#ff5d6c;color:#ff5d6c}
@keyframes pulse{50%{opacity:.35}}
.view{display:none;flex:none;flex-direction:column;gap:16px}
.view.on{display:flex}
.card{background:linear-gradient(180deg,#0e1836,#0b1330);border:1px solid var(--line);border-radius:var(--r)}

.hist h3,.act h3{font-size:12px;color:var(--mut);font-weight:500;padding:2px 6px 6px}

.hist button:hover{background:#111c3d}
.hist button.on{background:#16254f;border-color:var(--blue)}
.hist .new{background:var(--blue);border-color:var(--blue);color:#fff;text-align:center;font-weight:600;margin-bottom:4px}
.conv{display:flex;flex-direction:column;min-height:0;flex:1}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.m{max-width:92%;display:flex;gap:10px}
.m.u{align-self:flex-end;flex-direction:row-reverse}
.m .b{white-space:pre-wrap;padding:11px 14px;border-radius:14px;line-height:1.5;background:#12204a;border:1px solid var(--line)}
.m.u .b{background:var(--blue);border-color:var(--blue)}
.m .b small{display:block;color:var(--mut);font-size:11px;margin-top:6px}
.m.u .b small{color:#dbe6ff}
.m .av{width:30px;height:30px;background:linear-gradient(135deg,#1c3a96,var(--blue))}
.typing span{display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:50%;background:var(--blue2);animation:pulse 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 10px}
.chips button{padding:6px 11px;border:1px solid var(--line);border-radius:99px;font-size:12px;color:var(--mut)}
.chips button:hover{border-color:var(--blue);color:#fff}
.inp{display:flex;align-items:flex-end;gap:10px;padding:14px 16px;border-top:1px solid var(--line);background:var(--bg2);flex:none}
.inp textarea{flex:1;min-width:0;min-height:62px;max-height:140px;resize:none;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--txt);font:inherit;line-height:1.45}
.inp textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px #2f6bff33}
.send{background:var(--blue);height:48px;padding:0 18px;border-radius:12px;display:flex;align-items:center;gap:8px;font-weight:600;box-shadow:0 6px 20px #2f6bff55}
.send:hover{background:#4379ff}
.act{padding:12px 14px;max-height:190px;overflow:auto}
.ev{display:flex;gap:10px;padding:7px 0;border-top:1px solid #14214a;align-items:flex-start}
.ev:first-of-type{border-top:0}
.ev time{color:var(--mut);font-size:11px;margin-left:auto;white-space:nowrap}
.ev span{line-height:1.4}
aside.agents{background:var(--bg2);border-left:1px solid var(--line);padding:20px 16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.agents h2{font-size:14px;font-weight:600}
.agents>p{color:var(--mut);font-size:12px;margin-bottom:4px}
